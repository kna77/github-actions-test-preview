name: autofix-proposal

on:
  pull_request_review:
    types: [submitted]

jobs:
  propose-fix:
    if: github.event.review.body != '' || github.event.review.state == 'changes_requested'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Collect review context
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.pull_request.number;
            const reviewId = context.payload.review.id;

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const { data: reviewComments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const thisReviewComments = reviewComments
              .filter(c => c.pull_request_review_id === reviewId)
              .map(c => `**${c.path}** (line ${c.line ?? 'N/A'}):\n${c.body}`)
              .join('\n\n');

            const diff = files
              .filter(f => f.patch)
              .map(f => `### ${f.filename}\n\`\`\`diff\n${f.patch}\n\`\`\``)
              .join('\n\n');

            const payload = {
              reviewBody: context.payload.review.body || '',
              reviewComments: thisReviewComments,
              diff,
              prNumber,
            };

            fs.writeFileSync('/tmp/review_payload.json', JSON.stringify(payload));

      - name: Generate fix proposals with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, urllib.request, os, sys

          with open('/tmp/review_payload.json') as f:
              payload = json.load(f)

          review_section = ""
          if payload['reviewBody']:
              review_section += f"### レビュー全体コメント\n{payload['reviewBody']}\n\n"
          if payload['reviewComments']:
              review_section += f"### 行コメント\n{payload['reviewComments']}\n\n"

          if not review_section.strip():
              print("No review content found. Skipping.")
              with open('/tmp/fix_proposal.txt', 'w') as f:
                  f.write("(レビューコメントが空のため、修正提案はありません)")
              sys.exit(0)

          prompt = f"""あなたはコードレビューの修正提案AIです。
          以下のPRレビューコメントを受けて、各指摘に対する具体的な修正提案をMarkdown形式で出力してください。

          ## レビューコメント
          {review_section}

          ## 変更差分
          {payload['diff']}

          ## 出力形式
          各指摘ごとに以下の構成で出力してください：

          ### 指摘: [指摘の要点]
          **問題:** （何が問題か1行で）
          **修正後のコード:**
          ```（言語）
          （修正後のコードスニペット）
          ```
          """

          body = json.dumps({
              "model": "claude-sonnet-4-6",
              "max_tokens": 2048,
              "messages": [{"role": "user", "content": prompt}]
          }).encode()

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=body,
              headers={
                  "x-api-key": os.environ["ANTHROPIC_API_KEY"],
                  "anthropic-version": "2023-06-01",
                  "content-type": "application/json",
              }
          )

          with urllib.request.urlopen(req) as res:
              data = json.loads(res.read())

          proposal = data["content"][0]["text"]
          with open('/tmp/fix_proposal.txt', 'w') as f:
              f.write(proposal)
          EOF

      - name: Post fix proposal as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const proposal = fs.readFileSync('/tmp/fix_proposal.txt', 'utf8');
            const payload = JSON.parse(fs.readFileSync('/tmp/review_payload.json', 'utf8'));

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: payload.prNumber,
              body: [
                '## 🤖 自動修正提案',
                '',
                proposal,
                '',
                '---',
                '_Generated by Claude Sonnet 4.6 ([autofix-proposal](../../actions/workflows/autofix-proposal.yml))_',
              ].join('\n'),
            });
